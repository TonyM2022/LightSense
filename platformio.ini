; LightSense - ESP32-S3 Flicker Meter
; Board: Wifiduino32S3 (Blinker WiFiduino32S3, ESP32-S3, 8MB Flash)

[platformio]
; 构建产物/库依赖移出 OneDrive 同步目录: OneDrive 文件锁与按需同步会随机损坏 .pio
; (${platformio.core_dir} = ~/.platformio, 各机器通用)
build_dir = ${platformio.core_dir}/builds/LightSense
libdeps_dir = ${platformio.core_dir}/libdeps/LightSense

[env:wifiduino32s3]
; 固定官方 espressif32 6.10.0 (arduino-esp32 2.0.17): 代码基于 2.x LEDC API,
; 不升级到 pioarduino 55.x (arduino 3.3.x 移除了 ledcSetup/ledcAttachPin 等旧 API)
platform = espressif32@6.10.0
board = wifiduino32s3
board_build.partitions = default_8MB.csv  ; 8MB Flash 板用 8MB 分区表 (app0 3.375MB; 默认 1.25MB 装不下 U8g2 中文字库)
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+          ; ESPAsyncWebServer 头文件内包含 impl 头, 需要 LDF 深度扫描
lib_deps =
    kosme/ArduinoFFT@^2.0.0
    me-no-dev/ESPAsyncWebServer@^1.2.3
    me-no-dev/AsyncTCP@^1.1.1
    olikraus/U8g2@^2.35.19
    knolleary/PubSubClient@^2.8
